[package]
name = "piirit-app"
version = "2.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Binary that wires DeltaChatCore + the chat/message list models into a QmlEngine and loads the Silica UI from qml/."

[dependencies]
piirit-shim = { path = "../piirit-shim" }
# No log bridge. See piirit-shim/Cargo.toml.
qmetaobject = { version = "0.2", default-features = false }
# cpp! QTranslator (src/translations.rs). Same versions as vendored qmetaobject.
cpp = "0.5"
# Not Rust-used. build.rs reads DEP_QT_* from qttypes.
qttypes = "0.2"

[build-dependencies]
cpp_build = "0.5"

[[bin]]
name = "harbour-piirit"
path = "src/main.rs"

[lints]
workspace = true
