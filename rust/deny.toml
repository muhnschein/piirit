# cargo-deny. Licence: GPL-3.0-or-later Piirit, MPL-2.0 core. Bad licence = distribution problem.
# Conveyance: `License:` in rpm/harbour-piirit.spec, vendor/deltachat-rpc-server/SOURCE.md.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive, GPL-3.0-or-later (Piirit), MPL-2.0 (core). Others need review.
# Absent on purpose: GPL-2.0-only, AGPL-3.0 (real problems).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "GPL-3.0-or-later",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# LAME (src/voice.rs) and bindings. LGPL exception here, not in allow: next LGPL
# crate gets own review. docs/BUILDING.md: why LAME.
exceptions = [
    { allow = ["LGPL-3.0"], crate = "mp3lame-sys" },
    { allow = ["LGPL-3.0"], crate = "mp3lame-encoder" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
