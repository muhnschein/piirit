[workspace]
resolver = "2"
members = [
    "deltachat-jsonrpc",
    "piirit-shim",
    "piirit-app",
    "piirit-video",
]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
# Sailfish OS ships Rust 1.75.0 (sailfishos/rust). Declaring it here keeps
# `cargo update` on a newer host from resolving dependencies that no longer
# build on the toolchain the device target actually has -- together with
# .cargo/config.toml at the top of the tree, without which resolver "2"
# ignores this line. Clippy reads it too: `incompatible_msrv` flags a std
# API newer than this on the pinned stable toolchain.
rust-version = "1.75"
# Never published: these are workspace-internal crates wired by path, and an
# application, not a library. Saying so is also what lets cargo-deny treat the
# internal path deps as private rather than wildcard dependencies (deny.toml,
# `allow-wildcard-paths`) -- that allowance does not apply to publishable
# crates, because crates.io forbids path deps in the first place.
publish = false

# Lints live at the workspace level so a bare `cargo clippy` fails the same
# way CI's `-D warnings` does, instead of only warning locally.
[workspace.lints.rust]
# Denied here rather than through RUSTFLAGS, which reaches the whole
# dependency graph: cargo caps lints for crates it fetches, but not for the
# vendored qmetaobject, whose own warnings would then fail our build.
# This table applies to workspace members, which is what the rule is about.
warnings = "deny"
unsafe_code = "deny"
missing_docs = "deny"
# A path spelled out where a `use` already brought the name in, and casts
# to the type the value already has: noise that hides the casts that
# matter. Not `trivial_numeric_casts`: whether `x as c_char` is trivial
# depends on the target (c_char is i8 on the x86_64 CI, u8 on the phone),
# so it could pass CI and fail the device build.
unused_qualifications = "deny"
trivial_casts = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
disallowed_methods = "deny"
# Picked from nursery and restriction by running them over this tree, not
# taken as groups: those move between releases and many of their lints are
# taste. Each of these is a bug class or a lost diagnosis.
#
# A lock guard living through an `if let`/`match` body. A std Mutex held
# that long is how a Qt callback and a tokio task deadlock each other.
significant_drop_in_scrutinee = "deny"
redundant_clone = "deny"
needless_collect = "deny"
derive_partial_eq_without_eq = "deny"
# `assert!(r.is_ok())` fails without saying what the error was; with over
# a hundred Qt test binaries that are slow to rerun, the message is the
# diagnosis.
assertions_on_result_states = "deny"
# `.map_err(|_| ...)` throws the cause away, which on a phone is often all
# there was to go on.
map_err_ignore = "deny"
mem_forget = "deny"
# Debugging leftovers.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
# The panic-freedom lints -- `indexing_slicing`, `string_slice`,
# `arithmetic_side_effects`, `panic` and the rest -- are not here: they
# apply to shipped code only, and this table cannot say that. Each crate
# root denies them under `cfg_attr(not(test), ...)` instead.

# How the packaged binary is built. Each setting is paid for in build
# time and was measured on the aarch64 package (docs/BUILDING.md, "What a
# package weighs"):
#
# `strip` first, because the assumption it corrects is written down
# elsewhere in this tree: the SDK's rpmbuild does *not* strip what it
# packages -- Harbour's own validator says "file is not stripped!" of
# every build so far -- and the symbol tables were 2.08 MB of a 5.83 MB
# binary, none of it read on a phone. `main` is not lost with them: it is
# exported through `--dynamic-list` (piirit-app/build.rs) into `.dynsym`,
# which `--strip-all` does not touch, and the booster looks it up there.
# See docs/HARBOUR.md, "Exporting main()".
#
# `lto` and `codegen-units` then let rustc inline across crates and stop
# splitting the work into sixteen units it cannot optimise between. Thin
# LTO rather than fat: the same shape of win for a fraction of the link
# time, which under scratchbox2 is the part that hurts.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

# qmetaobject builds its QML engine on QApplication, from QtWidgets, which
# Harbour does not allow (docs/HARBOUR.md). The vendored copy is upstream
# 0.2.10 plus third_party/qmetaobject.patch, three lines swapping it for
# QGuiApplication; ci/vendor-check.sh proves it is exactly that and nothing
# more.
[patch.crates-io]
qmetaobject = { path = "../third_party/qmetaobject" }
