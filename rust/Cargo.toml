[workspace]
resolver = "2"
members = [
    "deltachat-jsonrpc",
    "piirit-shim",
    "piirit-app",
    "piirit-video",
]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
# Sailfish ships Rust 1.75.0. Pin stops newer hosts resolving deps device can't build.
# Needs .cargo/config.toml (resolver "2") too. Clippy `incompatible_msrv` checks it.
rust-version = "1.75"
# Never published: internal path crates, app not lib. cargo-deny treats path deps as private
# (deny.toml `allow-wildcard-paths`); crates.io bans path deps.
publish = false

# Workspace lints: bare `cargo clippy` fails like CI `-D warnings`.
[workspace.lints.rust]
# Denied here, not RUSTFLAGS (would hit vendored qmetaobject warnings).
warnings = "deny"
unsafe_code = "deny"
missing_docs = "deny"
# Ban redundant path prefixes and identity casts. Not `trivial_numeric_casts`:
# `x as c_char` is i8 on CI, u8 on phone.
unused_qualifications = "deny"
trivial_casts = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
disallowed_methods = "deny"
# Bug classes only, picked by running on tree. Lock guard held over `if let`/`match`
# deadlocks Qt callback vs tokio.
significant_drop_in_scrutinee = "deny"
redundant_clone = "deny"
needless_collect = "deny"
derive_partial_eq_without_eq = "deny"
# `assert!(r.is_ok())` hides the error; the message is the diagnosis.
assertions_on_result_states = "deny"
# `.map_err(|_| ...)` drops the cause; often the only clue on a phone.
map_err_ignore = "deny"
mem_forget = "deny"
# Debugging leftovers.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
# Panic-freedom lints not here: shipped code only. Crate roots deny them under
# `cfg_attr(not(test), ...)`.

# Packaged binary; each costs build time (docs/BUILDING.md, "What a package weighs"):
#
# `strip`: SDK rpmbuild does NOT strip; symbols were 2.08 of 5.83 MB. `main` survives in
# `.dynsym` via `--dynamic-list` (piirit-app/build.rs). docs/HARBOUR.md, "Exporting main()".
#
# `lto`, `codegen-units`: cross-crate inlining; thin LTO for less link time (slow in sb2).
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

# Line tables only: stacks keep file:line, gdb loses locals. Full debug info was 70% of each
# 120 MB test binary; 232 of them, each links FFmpeg: shim change relinked 206s, now 55s.
[profile.dev]
debug = "line-tables-only"

# qmetaobject needs QtWidgets QApplication, which Harbour bans (docs/HARBOUR.md).
# Vendored copy: upstream 0.2.10 + third_party/qmetaobject.patch. ci/vendor-check.sh checks.
[patch.crates-io]
qmetaobject = { path = "../third_party/qmetaobject" }
