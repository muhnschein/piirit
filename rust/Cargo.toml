[workspace]
resolver = "2"
members = [
    "deltachat-jsonrpc",
    "piirit-shim",
    "piirit-app",
]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
# Sailfish OS ships Rust 1.75.0 (sailfishos/rust). Declaring it here keeps
# `cargo update` on a newer host from resolving dependencies that no longer
# build on the toolchain the device target actually has.
rust-version = "1.75"
# Never published: these are workspace-internal crates wired by path, and an
# application, not a library. Saying so is also what lets cargo-deny treat the
# internal path deps as private rather than wildcard dependencies (deny.toml,
# `allow-wildcard-paths`) -- that allowance does not apply to publishable
# crates, because crates.io forbids path deps in the first place.
publish = false

# Lints live at the workspace level so a bare `cargo clippy` fails the same
# way CI's `-D warnings` does, instead of only warning locally.
[workspace.lints.rust]
# Denied here rather than through RUSTFLAGS, which reaches the whole
# dependency graph: cargo caps lints for crates it fetches, but not for the
# vendored qmetaobject, whose own warnings would then fail our build.
# This table applies to workspace members, which is what the rule is about.
warnings = "deny"
unsafe_code = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
disallowed_methods = "deny"

# qmetaobject builds its QML engine on QApplication, from QtWidgets, which
# Harbour does not allow (docs/HARBOUR.md). The vendored copy is upstream
# 0.2.10 plus third_party/qmetaobject.patch, three lines swapping it for
# QGuiApplication; ci/vendor-check.sh proves it is exactly that and nothing
# more.
[patch.crates-io]
qmetaobject = { path = "../third_party/qmetaobject" }
