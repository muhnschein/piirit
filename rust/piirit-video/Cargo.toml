[package]
name = "piirit-video"
version = "2.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Makes a video small enough to send: FFmpeg decodes it, x264 encodes it again at the outgoing media quality's bit rate. Both are built from source into the app; see build.rs."
# FFmpeg and x264 configure runs are done by build.rs, which must know when to rerun.
build = "build.rs"
links = "piirit_video"

[dependencies]

[build-dependencies]
# Cargo's compiler for this target, given to both configure scripts so they build
# for what the binary targets. Already in tree via cpp_build, same version.
cc = "1"

[lints]
workspace = true
