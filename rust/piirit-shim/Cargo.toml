[package]
name = "piirit-shim"
version = "2.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Qt/QML integration layer: exposes DeltaChatCore as a QObject and chat/message lists as QAbstractListModel for use from Silica QML. Depends on Qt5 via qmetaobject-rs."

[dependencies]
deltachat-jsonrpc = { path = "../deltachat-jsonrpc" }
# No log bridge (log crate's only reason here).
qmetaobject = { version = "0.2", default-features = false }
# cpp! blocks (src/recorder.rs, pictures.rs, mic_watch.rs): C++ APIs qmetaobject doesn't bind.
# Same versions as vendored qmetaobject: nothing new in Cargo.lock.
cpp = "0.5"
# Not Rust-used. build.rs reads DEP_QT_* for <QtMultimedia/...>.
qttypes = "0.2"
# net, io-util: webxdc loopback host (webxdc_host.rs). time: restart backoff, signup
# deadline. fs: async writes (icon, store app, handover) without blocking JSON-RPC runtime thread.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "io-util", "time", "fs"] }
# Viewer timezone for day separator: offset at message's instant, not now. std has no tz;
# localtime_r denied (`unsafe_code`).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = "1"
# QR both ways, pure Rust, 1.75 floor. No default features (rqrr image crate needs 1.85).
qrcode = { version = "0.14", default-features = false }
rqrr = { version = "0.10", default-features = false }
# Voice MP3 (every client plays it). LAME via mp3lame-sys. Sailfish: no iOS-playable encoder.
mp3lame-encoder = "0.2"
# Picked video, small enough to send (src/video.rs). FFmpeg + x264 from source.
piirit-video = { path = "../piirit-video" }

[build-dependencies]
cpp_build = "0.5"

[dev-dependencies]
tokio = { version = "1", features = ["io-std", "io-util", "macros"] }

[[bin]]
name = "fake-health-server"
path = "src/bin/fake_health_server.rs"
test = false
doc = false

# Onboarding test double. See module docs.
[[bin]]
name = "fake-core-server"
path = "src/bin/fake_core_server.rs"
test = false
doc = false

[lints]
workspace = true
