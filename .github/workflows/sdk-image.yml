# Publishes the Sailfish SDK image `rpm.yml` builds with.
#
# Upstream SDK: three arches' rootfs; BuildRequires zypper'd into target every
# build (5.0 GB pull, ~30 s zypper per RPM). `ci/build-sdk-image.sh` makes a
# one-arch image with packages in place (~2 GB); this publishes it to the
# registry.
#
# Run on SDK version change or new BuildRequires; commit the digest it prints to
# ci/sdk-images. (rpm.yml derives one itself only for an unpinned version.)
name: sdk-image

on:
  workflow_dispatch:
    inputs:
      sfos_version:
        description: >
          Sailfish SDK version to derive from. It needs a pinned digest in
          ci/build-sdk-image.sh, which is what fixes the contents of a
          third party's image.
        type: string
        default: "5.2.0.15"

permissions:
  contents: read
  # Why this exists.
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ARCH: aarch64
      SFOS: ${{ inputs.sfos_version || '5.2.0.15' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing pushes with git: token not left in .git/config.
          persist-credentials: false

      # Upstream image unpacks to ~20 GB of layers; flattened copy written
      # beside it. Fresh runner has ~25 GB free, mostly unused toolchains.
      - name: Make room for two SDK images
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android "$AGENT_TOOLSDIRECTORY" \
                      /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h / | tail -1

      # Via env, not spliced into `run:`: `${{ }}` becomes shell text before
      # shell reads it.
      - name: Sign in to the registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" |
            docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Tag per commit, never reused: builds pin a digest (ci/sdk-images), and
      # an older release must still find the image it was built in.
      - name: Derive the image
        env:
          PIIRIT_ENGINE: docker
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')
          image="ghcr.io/$owner/piirit-sdk:$SFOS-$ARCH-$(git rev-parse --short=12 HEAD)"
          ./ci/build-sdk-image.sh "$SFOS" "$ARCH" "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      # Not live until its digest is committed to ci/sdk-images.
      - name: Publish it
        run: |
          docker push "$IMAGE"
          ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          echo "pin: $SFOS $ref"
          {
            echo "### \`$IMAGE\`"
            docker image inspect --format '- unpacked: {{.Size}} bytes' "$IMAGE"
            echo
            echo "To build with it, this line in \`ci/sdk-images\`:"
            echo
            echo "    $SFOS $ref"
          } >> "$GITHUB_STEP_SUMMARY"
