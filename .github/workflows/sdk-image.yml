# Publishes the Sailfish SDK image `rpm.yml` builds with.
#
# Upstream's platform SDK carries three architectures' target rootfs and
# leaves this package's BuildRequires to be installed into the target on
# every build that uses it: 5.0 GB to pull and half a minute of zypper,
# on every single RPM build. `ci/build-sdk-image.sh` derives an image with
# one architecture and those packages already in place -- about 2 GB, and
# nothing to install -- and this publishes it to the repository's registry.
#
# Run it when the SDK version changes, when the spec gains a BuildRequires,
# or never: `rpm.yml` derives and publishes the image itself when it finds
# none. This exists so that cost can be paid deliberately rather than by
# whoever happens to build the first package afterwards.
name: sdk-image

on:
  workflow_dispatch:
    inputs:
      sfos_version:
        description: >
          Sailfish SDK version to derive from. It needs a pinned digest in
          ci/build-sdk-image.sh, which is what fixes the contents of a
          third party's image.
        type: string
        default: "5.2.0.15"

permissions:
  contents: read
  # What this workflow is for.
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ARCH: aarch64
      SFOS: ${{ inputs.sfos_version || '5.2.0.15' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The upstream image unpacks to about 20 GB of layers, and the
      # flattened one is written beside it. A fresh runner has around 25 GB
      # free, most of it language toolchains nothing here compiles with.
      - name: Make room for two SDK images
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android "$AGENT_TOOLSDIRECTORY" \
                      /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h / | tail -1

      - name: Sign in to the registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Derive the image
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          image="ghcr.io/$owner/piirit-sdk:$SFOS-$ARCH"
          ./ci/build-sdk-image.sh "$SFOS" "$ARCH" "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Publish it
        run: |
          docker push "$IMAGE"
          echo "### \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          docker image inspect --format \
            '- unpacked: {{.Size}} bytes' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
