name: ci

# `main` only: a bare `push:` beside `pull_request:` runs everything twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes the run in flight. `github.ref`, not `run_id`:
# `head_ref` is set only for pull_request, so on a push the old fallback
# gave every run a group of its own and nothing was ever cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A runner compiles once and throws the machine away, so incremental
  # state is written, cached and never read. Off, it is smaller to cache
  # and slightly faster to produce.
  CARGO_INCREMENTAL: 0

jobs:
  # Lints, unit tests, and the Qt event-loop tests. The toolchain comes from
  # rust-toolchain.toml.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # qml-module-qtquick2 is the QtQuick runtime plugin, which the -dev
      # packages do not pull in. qttools5-dev-tools is lrelease, which the
      # app's translation test compiles a catalog with. qtmultimedia5-dev
      # is QAudioRecorder, which the shim's voice recorder is built on.
      - run: ./ci/apt-install.sh qtbase5-dev qtdeclarative5-dev qtmultimedia5-dev qtdeclarative5-dev-tools qml-module-qtquick2 qml-module-qtgraphicaleffects qttools5-dev-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - run: rustc --version && cargo --version
      - run: cd rust && cargo fmt --all --check
      # `--locked` on every cargo call that resolves dependencies: the
      # lockfile is committed, so a manifest change without it fails here
      # instead of cargo quietly rewriting the lock the build then uses.
      - run: cd rust && cargo clippy --locked --workspace --all-targets -- -D warnings
      # nextest runs each test in its own process instead of one test
      # binary at a time. This suite is over a hundred binaries that mostly
      # wait on Qt timers, so the step went from about ten minutes to about
      # two and a half. rust/.config/nextest.toml says the rest, including
      # what the `ci` profile changes.
      - uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2.87.10
        with:
          tool: cargo-nextest
      # Also set by the tests; here so a failure is never a missing
      # display.
      - run: cd rust && cargo nextest run --locked --workspace --profile ci
        env:
          QT_QPA_PLATFORM: offscreen
      # nextest does not run doctests. There are none today, which is
      # exactly how one would get added and never run again.
      - run: cd rust && cargo test --locked --workspace --doc
      # Broken intra-doc links are errors.
      - run: cd rust && RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --no-deps

  # The device toolchain floor: Sailfish ships Rust 1.75.0 and does not get
  # to pick a newer one.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./ci/apt-install.sh qtbase5-dev qtdeclarative5-dev qtmultimedia5-dev
      - run: rustup toolchain install 1.75.0 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          # rust-cache keys on the DEFAULT toolchain, and this job builds
          # with `+1.75.0`. Without a key of its own the entry would collide
          # with the stable jobs' and neither would ever hit.
          key: msrv-1.75.0
      # Warnings are denied by the workspace lints table, not RUSTFLAGS:
      # see rust/Cargo.toml.
      - run: cd rust && cargo +1.75.0 check --locked --workspace --all-targets
      # Checked here, next to the toolchain it constrains.
      - run: ./ci/check-lockfile.sh

  # What no fake server can prove: that our shapes are the real core's.
  # Offline, against the pinned binary.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # real_core drives the shim through a QML probe.
      - run: ./ci/apt-install.sh qtbase5-dev qtdeclarative5-dev qtmultimedia5-dev qml-module-qtquick2 qml-module-qtgraphicaleffects
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      # Checksum-pinned on the wheel and the extracted binary.
      - run: ./scripts/fetch-rpc-server.sh
      - run: cd rust && cargo test --locked -p deltachat-jsonrpc --test real_server
        env:
          DELTACHAT_RPC_SERVER: vendor/deltachat-rpc-server/x86_64/deltachat-rpc-server
      - run: cd rust && cargo test --locked -p piirit-shim --test real_core
        env:
          DELTACHAT_RPC_SERVER: vendor/deltachat-rpc-server/x86_64/deltachat-rpc-server
          QT_QPA_PLATFORM: offscreen

  # What decides whether the RPM installs and the launcher works; none of it
  # is reachable from `cargo test`.
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./ci/apt-install.sh qtdeclarative5-dev-tools qttools5-dev-tools qml-module-qtgraphicaleffects rpm desktop-file-utils shellcheck
      - run: ./ci/qml-lint.sh
      # Strict: a checker that is not installed fails here, so the job
      # cannot quietly stop checking when the apt line above changes.
      - run: ./ci/packaging-lint.sh
        env:
          PACKAGING_LINT_STRICT: 1
      # scripts/sonar-report.sh talks to a service no test can reach, so it
      # is proved against a stub server instead. It runs here rather than in
      # `test` because it is a shell script with no cargo in it.
      - run: ./ci/sonar-report-selftest.sh
      # ci/apt-install.sh decides which apt sources every other job keeps.
      # Getting that wrong deletes the archive and fails everything, so the
      # rule is proved on a directory of the test's own.
      - run: ./ci/apt-install-selftest.sh

  # What Harbour would reject, caught before it is written rather than at
  # intake. `sfdk check -s harbour` on the real RPM is the authority and
  # runs in rpm.yml; this asks the same questions of the sources, and is
  # mandatory because the answers only get more expensive to change.
  # docs/HARBOUR.md.
  harbour:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rpm for rpmspec (the %files layout), file for the icons, binutils
      # for the binary's symbols.
      - run: ./ci/apt-install.sh rpm file binutils qtbase5-dev qtdeclarative5-dev qtmultimedia5-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      # The bundled server is one of the files the package installs, so
      # the layout check cannot judge it while it is absent.
      - run: ./scripts/fetch-rpc-server.sh
      # 1.7 reads the linked binary: that main() is exported, and that it
      # survives the strip rpmbuild does. Debug is enough -- both are
      # settled by the link, not the optimisation level.
      - run: cd rust && cargo build --locked -p piirit-app
      # The gate itself, then the proof that the gate still bites.
      - run: ./ci/harbour-check.sh
        env:
          HARBOUR_CHECK_STRICT: 1
      - run: ./ci/harbour-check-selftest.sh
      # The vendored qmetaobject is what keeps QtWidgets out of the binary,
      # so what it contains is a Harbour question too.
      - run: ./ci/vendor-check.sh

  # Licences matter here: Piirit is GPLv3+ and ships beside an MPL-2.0
  # core binary, so an incompatible dependency is a distribution problem
  # (docs/PROJECT.md).
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # By commit, not tag: a tag on a third-party action can be repointed
      # at any commit by whoever owns it, and this one runs on every pull
      # request. .github/dependabot.yml moves the pin.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: rust/Cargo.toml
