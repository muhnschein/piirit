name: ci

# `main` only: bare `push:` beside `pull_request:` runs everything twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# New push supersedes in-flight run. Fallback `github.ref`, not `run_id`:
# head_ref is PR-only, so `run_id` gave each push its own group, never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Runner discards machine: incremental state never read. Off = smaller cache.
  CARGO_INCREMENTAL: 0

jobs:
  # Docs-only PR (`*.md` outside vendor/, third_party/): Rust jobs skipped. A
  # job skipped by `if:` passes as a required check. Rules: ci/changes.sh.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Merge commit and its base parent.
          fetch-depth: 2
      - id: diff
        run: ./ci/changes.sh >>"$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}

  # Lints, unit and Qt event-loop tests. Toolchain from rust-toolchain.toml.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Submodules: FFmpeg, x264 for piirit-video (docs/BUILDING.md).
        with:
          # Token not left in .git/config (nothing pushes).
          persist-credentials: false
          submodules: true
      # QtQuick runtime plugin (-dev omits it), lrelease (translation test),
      # QAudioRecorder (voice recorder), QtQuick.Window (chat search test),
      # libpulse (mic watch), pulseaudio + utils (its test's sound server).
      - run: ./ci/apt-install.sh qtbase5-dev qtdeclarative5-dev qtmultimedia5-dev qtdeclarative5-dev-tools qml-module-qtquick2 qml-module-qtquick-window2 qttools5-dev-tools libqt5svg5 libpulse-dev pulseaudio pulseaudio-utils
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - run: rustc --version && cargo --version
      - run: cd rust && cargo fmt --all --check
      # `--locked`: lockfile committed; a manifest change without it fails here.
      - run: cd rust && cargo clippy --locked --workspace --all-targets -- -D warnings
      # nextest: one process per test, 32 at once, ~10 min down to ~2 (Qt timers).
      # Profiles: rust/.config/nextest.toml.
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest
      # Test killed by a signal leaves its core here (#239); read below on failure.
      # Proved each run: a shell that crashes itself must leave one, else step fails.
      - run: |
          mkdir -p "$RUNNER_TEMP/cores"
          echo "$RUNNER_TEMP/cores/core.%p.%E" | sudo tee /proc/sys/kernel/core_pattern
          ulimit -c unlimited
          ! bash -c 'kill -SEGV $$'
          rm "$RUNNER_TEMP"/cores/core.*bash
      # Also set by tests; here so failure is never a missing display.
      - run: cd rust && ulimit -c unlimited && cargo nextest run --locked --workspace --profile ci
        env:
          QT_QPA_PLATFORM: offscreen
      # nextest skips doctests; none today, so one added would never run.
      - run: cd rust && cargo test --locked --workspace --doc
      # Broken intra-doc links are errors.
      - run: cd rust && RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --no-deps
      # Crashed test: stacks in the log; core, its binary, stacks kept a week.
      - if: failure()
        run: ./ci/core-backtraces.sh "$RUNNER_TEMP/cores"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-cores
          path: ${{ runner.temp }}/cores
          if-no-files-found: ignore
          retention-days: 7

  # Device toolchain floor: Sailfish ships Rust 1.75.0; no newer available.
  msrv:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - run: ./ci/apt-install.sh qtbase5-dev qtdeclarative5-dev qtmultimedia5-dev libpulse-dev
      - run: rustup toolchain install 1.75.0 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          # Own key: rust-cache keys on default toolchain, job uses `+1.75.0`;
          # shared key would collide with stable jobs, neither hits.
          key: msrv-1.75.0
      # Denied by workspace lints table (rust/Cargo.toml), not RUSTFLAGS.
      - run: cd rust && cargo +1.75.0 check --locked --workspace --all-targets
      # Checked next to the toolchain it constrains.
      - run: ./ci/check-lockfile.sh

  # What no fake server proves: our shapes match the real core. Pinned binary.
  integration:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      # real_core drives shim through a QML probe.
      - run: ./ci/apt-install.sh qtbase5-dev qtdeclarative5-dev qtmultimedia5-dev qml-module-qtquick2 libpulse-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      # Checksum-pinned: wheel and extracted binary.
      - run: ./scripts/fetch-rpc-server.sh
      - run: cd rust && cargo test --locked -p deltachat-jsonrpc --test real_server
        env:
          DELTACHAT_RPC_SERVER: vendor/deltachat-rpc-server/x86_64/deltachat-rpc-server
      - run: cd rust && cargo test --locked -p piirit-shim --test real_core
        env:
          DELTACHAT_RPC_SERVER: vendor/deltachat-rpc-server/x86_64/deltachat-rpc-server
          QT_QPA_PLATFORM: offscreen

  # What decides RPM install and launcher; none reachable from `cargo test`.
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./ci/apt-install.sh qtdeclarative5-dev-tools qttools5-dev-tools rpm desktop-file-utils shellcheck gdb
      - run: ./ci/qml-lint.sh
      # Strict: missing checker fails; job can't quietly stop.
      - run: ./ci/packaging-lint.sh
        env:
          PACKAGING_LINT_STRICT: 1
      # sonar-report.sh: stub-tested (service unreachable). Here: no cargo.
      - run: ./ci/sonar-report-selftest.sh
      # ci/apt-install.sh: wrong rule deletes the archive; proved on own dir.
      - run: ./ci/apt-install-selftest.sh
      # ci/changes.sh: wrong rule = code PR green without tests.
      - run: ./ci/changes-selftest.sh
      # ci/core-backtraces.sh: wrong = a crashed test leaves no stack.
      - run: ./ci/core-backtraces-selftest.sh

  # Harbour rejects, caught from sources before intake. Authority: `sfdk check
  # -s harbour` on real RPM (rpm.yml). Mandatory: fixes only get dearer.
  # docs/HARBOUR.md.
  harbour:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      # rpm (%files layout), file (icons), binutils (binary symbols).
      - run: ./ci/apt-install.sh rpm file binutils qtbase5-dev qtdeclarative5-dev qtmultimedia5-dev libpulse-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      # Bundled server is installed; layout check can't judge it absent.
      - run: ./scripts/fetch-rpc-server.sh
      # 1.7 reads linked binary: main() exported, survives rpmbuild strip.
      # Debug enough: both settled by link, not opt level.
      - run: cd rust && cargo build --locked -p piirit-app
      # The gate, then proof it still bites.
      - run: ./ci/harbour-check.sh
        env:
          HARBOUR_CHECK_STRICT: 1
      - run: ./ci/harbour-check-selftest.sh
      # Vendored qmetaobject keeps QtWidgets out of binary (a Harbour question).
      - run: ./ci/vendor-check.sh

  # Licences: GPLv3+ beside MPL-2.0 core; incompatible dep = distribution
  # problem (docs/PROJECT.md).
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo-deny prebuilt binary: the action's Docker Hub pull limit failed
      # every PR.
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny
      - run: cd rust && cargo deny check

  # Workflows: `${{ }}` in scripts, tokens in .git/config, cache trust.
  # Offline: tree only; scheduled.yml adds weekly online audits. Wrongly
  # raised findings: ignored in place, reason beside.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: zizmor@1.30.1
      - run: zizmor --offline .github/workflows/
