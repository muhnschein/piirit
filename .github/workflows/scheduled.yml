# What breaks without anyone pushing.
#
# ci.yml judges a change; this judges the world moving under an unchanged tree
# (new RustSec advisory, new stable clippy lint, pinned action with a known
# hole). Weekly and manual. Red blocks nothing: it is the notice.
name: scheduled

on:
  schedule:
    # Monday morning, off the hour other GitHub crons pick.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ci.yml's `deny` only runs on push. Red here: an advisory names a locked
  # crate. Bump (within 1.75 floor) or add to rust/deny.toml `ignore` with a
  # reason.
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny
      - run: cd rust && cargo deny check advisories

  # rust-toolchain.toml pins gate's toolchain, so new lints never fail a PR.
  # Other half: current stable's lints, so pin bumps are known work. Red = next
  # bump has fixes, not breakage.
  next-stable-clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - run: ./ci/apt-install.sh qtbase5-dev qtdeclarative5-dev qtmultimedia5-dev libpulse-dev
      - run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          # Own key: rust-cache keys on default toolchain; job uses `+stable`
          # (same as msrv job).
          key: next-stable
      - run: rustc +stable --version
      - run: cd rust && cargo +stable clippy --locked --workspace --all-targets -- -D warnings

  # Workspace under ASan and LSan, FFmpeg, x264 and C glue instrumented too
  # (limits: ci/leak-check.sh). Too slow per PR. Red = memory lost or misused;
  # log names allocation stack. Qt's deliberate leaks: ci/lsan.supp, narrowest
  # matching name.
  leak-check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      # Every test binary links instrumented FFmpeg: ~16 GB build, most of a
      # fresh runner's free disk.
      - name: Make room for the instrumented build
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android "$AGENT_TOOLSDIRECTORY" \
                      /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h / | tail -1
      # Same packages as ci.yml's test (same tests). llvm for llvm-symbolizer:
      # lsan.supp matches function names, present only once symbolized.
      - run: ./ci/apt-install.sh qtbase5-dev qtdeclarative5-dev qtmultimedia5-dev qtdeclarative5-dev-tools qml-module-qtquick2 qml-module-qtquick-window2 qttools5-dev-tools libqt5svg5 libpulse-dev pulseaudio pulseaudio-utils llvm
      # Nightly named in ci/leak-check.sh. No rust-cache: nothing shared with
      # other jobs; a week-old cache is gigabytes for little.
      - run: rustup toolchain install nightly-2026-10-12 --profile minimal --component rust-src
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest
      # So real_server and real_core run too, as in ci.yml's integration job.
      - run: ./scripts/fetch-rpc-server.sh
      - run: ./ci/leak-check.sh
        env:
          DELTACHAT_RPC_SERVER: ${{ github.workspace }}/vendor/deltachat-rpc-server/x86_64/deltachat-rpc-server

  # Reproducibility drift between releases (rpm.yml's `reproduce` gates only
  # releases). Red: main no longer rebuilds byte for byte; the log lists what
  # differs. Two rebuilds of one Docker build: Podman with our image, Podman
  # with an image derived here from upstream's (--upstream-sdk).
  repro-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Make room
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
                      "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
      - run: ./scripts/build-in-container.sh
        env:
          PIIRIT_ENGINE: docker
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repro-build
          path: RPMS/harbour-piirit-*.rpm
          if-no-files-found: error
          retention-days: 7

  repro-check:
    needs: repro-build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        sdk: [pinned, upstream]
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Upstream's image needs two images' room.
      - name: Make room
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
      # Upstream's build user is 100000: beyond a runner's 65536 subordinate
      # ids (docs/VERIFYING.md). Ours needs none of this.
      - name: Widen the subordinate id range
        if: matrix.sdk == 'upstream'
        run: |
          sudo sed -i "s/^$(id -un):.*/$(id -un):165536:1000000/" /etc/subuid /etc/subgid
          podman system migrate
      - run: gh run download "$GITHUB_RUN_ID" -n repro-build --dir rpms
      - name: Rebuild and compare
        env:
          PIIRIT_ENGINE: podman
          SDK: ${{ matrix.sdk }}
        run: |
          rpm=$(find rpms -name 'harbour-piirit-*.rpm' ! -name '*debug*' | head -1)
          set -- --no-download --rpm "$rpm" --ref "$GITHUB_SHA"
          [ "$SDK" = upstream ] && set -- --upstream-sdk "$@"
          PIIRIT_REPO="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
            ./scripts/verify-release.sh "$@"

  # ci.yml runs zizmor offline. Online adds: advisories on pinned actions,
  # pinned commits not on the action's own repo. These change without a
  # commit here, hence weekly.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: zizmor@1.30.1
      - run: zizmor .github/workflows/
        env:
          GH_TOKEN: ${{ github.token }}
