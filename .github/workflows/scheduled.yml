# What can go wrong without anyone pushing.
#
# ci.yml judges a change; this judges the world moving under an unchanged
# tree. A new RustSec advisory against a crate already in Cargo.lock, a
# lint the next stable clippy adds, an action pinned here that turns out
# to have a known hole -- none of those arrive with a commit, so none of
# them would be seen until the next pull request happened to trip over
# them.
#
# Weekly, and by hand from the Actions tab. A red run here blocks nothing;
# it is the notice. Each job says what to do about its own failure.
name: scheduled

on:
  schedule:
    # Monday morning, off the hour that every other cron on GitHub picks.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ci.yml's `deny` job runs the advisories too, but only when something
  # is pushed. A red run here means an advisory names a crate in the lock:
  # bump it (within the 1.75 floor), or record why it does not apply in
  # rust/deny.toml's `ignore`.
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny
      - run: cd rust && cargo deny check advisories

  # rust-toolchain.toml pins the toolchain the gate lints with, so a new
  # lint never fails a pull request out from under it. This is the other
  # half of that bargain: what the current stable would say, so that
  # bumping the pin is a known amount of work rather than a surprise.
  # Red means the next bump has fixes in it, not that anything is broken.
  next-stable-clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # FFmpeg and x264, which piirit-video builds (docs/BUILDING.md).
        with:
          persist-credentials: false
          submodules: true
      - run: ./ci/apt-install.sh qtbase5-dev qtdeclarative5-dev qtmultimedia5-dev libpulse-dev
      - run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          # rust-cache keys on the default toolchain, and this job builds
          # with `+stable`; the msrv job has the same problem and the same
          # answer.
          key: next-stable
      - run: rustc +stable --version
      - run: cd rust && cargo +stable clippy --locked --workspace --all-targets -- -D warnings

  # Every test in the workspace under AddressSanitizer and LeakSanitizer,
  # with FFmpeg, x264 and our C glue instrumented too: ci/leak-check.sh
  # says what that can and cannot see. Too slow for every pull request,
  # and a leak is rarely urgent enough to need one. Red means a test's
  # process lost memory or touched memory it should not have; the log
  # names the allocation's stack. A leak that is Qt's on purpose goes in
  # ci/lsan.supp, by the narrowest name that matches it.
  leak-check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # FFmpeg and x264, which piirit-video builds (docs/BUILDING.md).
        with:
          persist-credentials: false
          submodules: true
      # Every test binary links an instrumented FFmpeg: about 16 GB of
      # build, most of what a fresh runner has free.
      - name: Make room for the instrumented build
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android "$AGENT_TOOLSDIRECTORY" \
                      /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h / | tail -1
      # The same packages as ci.yml's test job, because the same tests run,
      # and llvm for llvm-symbolizer: ci/lsan.supp matches by function
      # name, which a report only has once it is symbolized.
      - run: ./ci/apt-install.sh qtbase5-dev qtdeclarative5-dev qtmultimedia5-dev qtdeclarative5-dev-tools qml-module-qtquick2 qml-module-qtquick-window2 qttools5-dev-tools libpulse-dev pulseaudio pulseaudio-utils llvm
      # The nightly ci/leak-check.sh names. No rust-cache: nothing this
      # builds is shared with another job, and a week-old cache of it
      # would be gigabytes to restore for little.
      - run: rustup toolchain install nightly-2026-10-12 --profile minimal --component rust-src
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest
      # So real_server and real_core run too, as in ci.yml's integration
      # job.
      - run: ./scripts/fetch-rpc-server.sh
      - run: ./ci/leak-check.sh
        env:
          DELTACHAT_RPC_SERVER: ${{ github.workspace }}/vendor/deltachat-rpc-server/x86_64/deltachat-rpc-server

  # ci.yml runs zizmor offline, on what is in the tree. Online it also asks
  # GitHub whether an action pinned here has a known advisory, and whether
  # each pinned commit is really on the action's own repository -- facts
  # that change without a commit here, which is why they are asked weekly.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: zizmor@1.30.1
      - run: zizmor .github/workflows/
        env:
          GH_TOKEN: ${{ github.token }}
