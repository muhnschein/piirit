# Sends tree to SonarQube Cloud, reports on the PR.
#
# Own workflow: needs full history (`fetch-depth: 0`); only job using a
# non-GitHub service. Scope: sonar-project.properties.
#
# ci.yml is the GATE; this is a REPORT that can't fail a change (quality gate is
# advice). Kept apart so a hosted service never joins "green make check = green
# CI".
#
# Actions pinned to commit, not tag: tags move; this job gets a token.
name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

# Tree read only. Scanner uses its own SonarQube token; SonarQube posts to the
# PR as its own App. Explicit block (as ci.yml, rpm.yml): none = repo default,
# which CodeQL flags.
permissions:
  contents: read

concurrency:
  group: sonar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Docs-only PR (`*.md` outside vendor/, third_party/): no scan, as ci.yml's
  # Rust jobs. Markdown has no rules here but secrets; GitHub's secret
  # scanning reads it anyway. Rules: ci/changes.sh.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Merge commit and its base parent.
          fetch-depth: 2
      - id: diff
        run: ./ci/changes.sh >>"$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}

  sonarqube:
    name: SonarQube
    needs: changes
    runs-on: ubuntu-latest
    # Hung step stops here, not at GitHub's 6 h.
    timeout-minutes: 30
    # Fork PRs have no secrets: SONAR_TOKEN empty, auth error. Skip; main's
    # analysis runs on merge.
    if: >-
      needs.changes.outputs.code == 'true' && (
        github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing pushes with git: token not left in .git/config.
          persist-credentials: false
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      # FFmpeg, x264. Not `submodules: true`: fetch-depth 0 would pull unread
      # history.
      - name: Fetch the submodules
        run: git submodule update --init --depth 1

      # Same packages as ci.yml's test: coverage runs whole suite, shim tests
      # drive real QtQuick (runtime plugin not in -dev packages).
      - name: Install Qt and PulseAudio
        run: |
          ./ci/apt-install.sh \
            qtbase5-dev \
            qtdeclarative5-dev \
            qtmultimedia5-dev \
            qtdeclarative5-dev-tools \
            qml-module-qtquick2 \
            qml-module-qtquick-window2 \
            qttools5-dev-tools \
            libqt5svg5 \
            libpulse-dev \
            pulseaudio \
            pulseaudio-utils

      # Pinned toolchain only (rust-toolchain.toml), as ci.yml. llvm-tools:
      # cargo-llvm-cov reads profiles with them.
      - name: Install llvm-tools for the pinned toolchain
        run: rustup component add llvm-tools-preview

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust

      # nextest as ci.yml's test: Makefile uses it when found, else falls back
      # to `cargo test` (~10 min here).
      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov,cargo-nextest

      # Scanner imports coverage, doesn't measure it. Without this: 0.0%.
      - name: make sonar-reports
        run: make sonar-reports

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Server processes report after upload; without this the run can't see its
      # result. Never `sonar.qualitygate.wait`: reports, doesn't gate.
      # continue-on-error: outage = warning.
      - name: What SonarQube made of it
        if: always()
        continue-on-error: true
        env:
          # Only for private projects. See the script.
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./scripts/sonar-report.sh
