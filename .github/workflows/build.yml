# Sends tree to SonarQube Cloud, reports on the PR.
#
# Own workflow: needs full history (`fetch-depth: 0`); only job using a
# non-GitHub service. Scope: sonar-project.properties.
#
# ci.yml is the GATE; this is a REPORT that can't fail a change (quality gate is
# advice). Kept apart so a hosted service never joins "green make check = green
# CI".
#
# Actions pinned to commit, not tag: tags move; this job gets a token.
name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

# Tree read only. Scanner uses its own SonarQube token; SonarQube posts to the
# PR as its own App. Explicit block (as ci.yml, rpm.yml): none = repo default,
# which CodeQL flags.
permissions:
  contents: read

concurrency:
  group: sonar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    # Fork PRs have no secrets: SONAR_TOKEN empty, auth error. Skip; main's
    # analysis runs on merge.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing pushes with git: token not left in .git/config.
          persist-credentials: false
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      # FFmpeg, x264. Not `submodules: true`: fetch-depth 0 would pull unread
      # history.
      - name: Fetch the submodules
        run: git submodule update --init --depth 1

      # Same packages as ci.yml's test: coverage runs whole suite, shim tests
      # drive real QtQuick (runtime plugin not in -dev packages).
      - name: Install Qt and PulseAudio
        run: |
          ./ci/apt-install.sh \
            qtbase5-dev \
            qtdeclarative5-dev \
            qtmultimedia5-dev \
            qtdeclarative5-dev-tools \
            qml-module-qtquick2 \
            qml-module-qtquick-window2 \
            qttools5-dev-tools \
            libpulse-dev \
            pulseaudio \
            pulseaudio-utils

      # `toolchain` passed explicitly: the action reads it from the ref name,
      # and a SHA has none. Pin the `v1` tag, not `stable` (rebuilt each
      # release; a commit from it stops belonging to the repo). v1 only moves
      # forward.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust

      # nextest as ci.yml's test: Makefile uses it when found, else falls back
      # to `cargo test` (~10 min here).
      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-llvm-cov,cargo-nextest

      # Scanner imports coverage, doesn't measure it. Without this: 0.0%.
      - name: make sonar-reports
        run: make sonar-reports

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Server processes report after upload; without this the run can't see its
      # result. Never `sonar.qualitygate.wait`: reports, doesn't gate.
      # continue-on-error: outage = warning.
      - name: What SonarQube made of it
        if: always()
        continue-on-error: true
        env:
          # Only for private projects. See the script.
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./scripts/sonar-report.sh
