# Device RPM built in the Sailfish SDK.
#
# Not in ci.yml: minutes per push in a multi-GB image. Run from Actions or on a
# tag.
#
# SDK needed for a runnable phone build: target's Qt 5.6 and glibc
# (docs/BUILDING.md).
#
# aarch64 only (project target; SDK image carries no other arch). Kept short
# by: own derived one-arch SDK image (sdk-image.yml); rust/target and crates
# carried between runs, FFmpeg/x264 in it reused when unchanged
# (rust/piirit-video/build_reuse.rs).
#
# Push to main: an RPM of each main commit, and cache every branch starts
# from (caches: own branch + main only) stays current.
name: rpm

on:
  workflow_dispatch:
    inputs:
      sfos_version:
        description: >
          Sailfish SDK version to build against. 5.2 is the Jolla Phone's
          baseline and the floor this project supports; Harbour also
          requires a binary to link __libc_start_main@GLIBC_2.34, which
          only a 5.x SDK's glibc provides. An older SDK builds a package
          that runs on older phones and that Harbour rejects.
        type: string
        default: "5.2.0.15"
      release:
        description: >
          Cut a release: the version to publish, which has to be what
          rpm/harbour-piirit.spec says, run on main. The commit is tagged
          v<version> and a GitHub release goes up with the package and
          CHANGELOG.md's section for it. Leave empty for an ordinary
          build. See docs/BUILDING.md.
        type: string
        default: ""
      rehearse:
        description: >
          Rehearse a release on this branch: build as the release would, rebuild
          it on a second runner and compare, but tag and publish nothing.
        type: boolean
        default: false
  push:
    # `v*` for release. `build-*`: throwaway; dispatch needs workflow on main.
    tags: ["v*", "build-*"]
    branches: [main]
    # Docs only: nothing packaged changes. Tags ignore path filters.
    paths-ignore: ["docs/**", "*.md"]

# Workflow needs tree read only; each job adds its own extra permissions, so
# neither holds the other's.
permissions:
  contents: read

jobs:
  rpm:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      # Derived image: this repo's registry; published when a run finds none.
      packages: write
    env:
      ARCH: aarch64
      SFOS: ${{ inputs.sfos_version || '5.2.0.15' }}
      RELEASE: ${{ inputs.release || '' }}
      REHEARSE: ${{ inputs.rehearse && '1' || '' }}
      # One cargo job, always (not a dispatch input): at 2+ the build stalls in
      # scratchbox2 often enough to cost more than parallelism saves.
      # docs/BUILDING.md.
      CARGO_JOBS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Submodules: FFmpeg, x264 for piirit-video (docs/BUILDING.md).
        with:
          # Token not left in .git/config (nothing pushes).
          persist-credentials: false
          submodules: true

      # Bundled beside app; checksum-pinned by script.
      - name: Fetch deltachat-rpc-server
        run: ./scripts/fetch-rpc-server.sh

      # Version is free text from dispatch form, spliced into image tag below.
      # Pinned in ci/sdk-images: that digest, nothing else. Unpinned (trying a
      # new SDK): a tag, derived if missing.
      - name: Name the SDK image this build wants
        run: |
          [[ $SFOS =~ ^[0-9]+(\.[0-9]+){3}$ ]] || {
            echo "::error::sfos_version '$SFOS' is not a dotted version"; exit 1; }
          pinned=$(awk -v v="$SFOS" '$1 == v { print $2; exit }' ci/sdk-images)
          if [ -n "$pinned" ]; then
            echo "SDK_IMAGE=$pinned" >> "$GITHUB_ENV"
            echo "SDK_PINNED=1" >> "$GITHUB_ENV"
          else
            owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')
            echo "SDK_IMAGE=ghcr.io/$owner/piirit-sdk:$SFOS-$ARCH" >> "$GITHUB_ENV"
          fi

      # Via env, not spliced into `run:`: `${{ }}` becomes shell text first.
      - name: Sign in to the registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" |
            docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # What/why: ci/build-sdk-image.sh. Deriving takes ~a whole run, so done
      # once and published; a run finding none derives it (not fail) and
      # publishes for the next.
      - name: Get the SDK image
        run: |
          if docker pull -q "$SDK_IMAGE"; then
            echo "using $SDK_IMAGE"
          elif [ -n "${SDK_PINNED:-}" ]; then
            echo "::error::$SDK_IMAGE (ci/sdk-images) can't be pulled; a derived one would be a different image"
            exit 1
          else
            echo "::notice::no $SDK_IMAGE published yet; deriving one, which makes this run slower"
            # Room for upstream and flattened images at once. Defaulted:
            # `rm -rf ""` errors and would fail the step.
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
                        "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
            ./ci/build-sdk-image.sh "$SFOS" "$ARCH" "$SDK_IMAGE"
            docker push "$SDK_IMAGE" ||
              echo "::warning::could not publish $SDK_IMAGE; the next run will derive it again"
          fi
          id=$(docker image inspect --format '{{.Id}}' "$SDK_IMAGE")
          echo "SDK_IMAGE_ID=${id#sha256:}" >> "$GITHUB_ENV"

      # Version/Release pinned in spec; mb2 -X: no git stamp. Without one every
      # build was harbour-piirit-0.1.0-1 and `rpm -U` did nothing.
      #
      # Run number is monotonic: each build upgrades the last. Releases build
      # the spec as committed (Release: 1).
      #
      # Release = `v*` tag, or dispatch on main with `release`; must match spec
      # version. Dispatch held to main: release job tags the commit it runs on.
      # Rehearsal: spec as committed too, any branch (reproduce rebuilds that).
      # Digits and periods only: Harbour rejects other Release chars, so short
      # SHA goes in artifact name instead.
      - name: Stamp the build so each one is its own package
        run: |
          short=$(git rev-parse --short HEAD)
          version=$(sed -n 's/^Version:[[:space:]]*//p' rpm/harbour-piirit.spec)
          wanted=""
          case "$GITHUB_REF" in
            refs/tags/v*) wanted=${GITHUB_REF#refs/tags/v} ;;
          esac
          if [ -n "$RELEASE" ]; then
            [ "$GITHUB_REF" = "refs/heads/main" ] || {
              echo "::error::a release is cut on main, not on $GITHUB_REF"; exit 1; }
            wanted=$RELEASE
          fi
          if [ -n "$wanted" ]; then
            [ "$wanted" = "$version" ] || {
              echo "::error::release $wanted, but rpm/harbour-piirit.spec says Version: $version"; exit 1; }
            release="1"
          elif [ -n "$REHEARSE" ]; then
            release="1"
          else
            release="1.${GITHUB_RUN_NUMBER}"
          fi
          sed -i "s/^Release:.*/Release:    ${release}/" rpm/harbour-piirit.spec
          grep '^Version:\|^Release:' rpm/harbour-piirit.spec
          echo "SHORT_SHA=$short" >> "$GITHUB_ENV"
          echo "RPM_RELEASE=$release" >> "$GITHUB_ENV"

      # Submodule commits FFmpeg/x264 build from, for the cache key below.
      - name: Name the C libraries' sources
        run: |
          libs=$(git ls-tree HEAD third_party/ffmpeg third_party/x264 | sha256sum | cut -c1-16)
          echo "C_LIBS=$libs" >> "$GITHUB_ENV"

      # ~56 crates (4 ours); deps rely only on lockfile + image toolchain: ~4
      # min cold, ~1 warm. FFmpeg/x264: ~8-12 min at one job, kept when stamp
      # matches (rust/piirit-video/build_reuse.rs). Exact hit never re-saves, so
      # key holds everything worth saving anew: image (one target triple, its
      # rust), lockfile, C lib sources and recipe. Stamp, not key, decides
      # reuse: an older fallback is safe.
      # Not for release (binary from tagged commit only) nor its rehearsal, here
      # and crates below;
      # zizmor can't read `if`, so its cache-poisoning finding ignored on both.
      - name: Restore the cross-compiled dependencies
        if: env.RELEASE == '' && env.REHEARSE == '' && !startsWith(github.ref, 'refs/tags/v')  # zizmor: ignore[cache-poisoning]
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rust/target
          key: rpm-target-${{ env.ARCH }}-${{ env.SDK_IMAGE_ID }}-${{ hashFiles('rust/Cargo.lock') }}-${{ env.C_LIBS }}-${{ hashFiles('rust/piirit-video/build.rs', 'rust/piirit-video/build_reuse.rs') }}
          restore-keys: |
            rpm-target-${{ env.ARCH }}-${{ env.SDK_IMAGE_ID }}-${{ hashFiles('rust/Cargo.lock') }}-
            rpm-target-${{ env.ARCH }}-${{ env.SDK_IMAGE_ID }}-
            rpm-target-${{ env.ARCH }}-

      # Crate sources: no crates.io dependency at release time.
      - name: Restore the crates
        if: env.RELEASE == '' && env.REHEARSE == '' && !startsWith(github.ref, 'refs/tags/v')  # zizmor: ignore[cache-poisoning]
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/piirit-cargo
          key: rpm-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: rpm-cargo-

      # Same script as local build, so the two can't drift (its comments say
      # why). Image named above; crates go where cache keeps them. Docker here;
      # `reproduce` rebuilds with Podman.
      # Normal: ~3 min warm, ~20 cold. A stall in scratchbox2 hangs, never
      # fails: cut off here, not at job's 120 min.
      - name: Build the RPM
        timeout-minutes: 45
        env:
          PIIRIT_ENGINE: docker
          PIIRIT_SDK_IMAGE: ${{ env.SDK_IMAGE }}
          PIIRIT_CARGO_JOBS: ${{ env.CARGO_JOBS }}
        run: PIIRIT_CARGO_HOME=~/.cache/piirit-cargo ./scripts/build-in-container.sh "$SFOS"

      # `|| true`: runs under `bash -e`; missing .mb2 would hide logs.
      - name: Show mb2's state
        if: failure()
        run: ls -la .mb2 2>/dev/null || true; tail -60 .mb2/*.log 2>/dev/null || true

      - name: Show what was built
        run: |
          find RPMS -name '*.rpm' -print -exec rpm -qip {} \; 2>/dev/null || \
            find . -name '*.rpm' -print

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harbour-piirit-${{ env.ARCH }}-sfos${{ env.SFOS }}-${{ env.SHORT_SHA }}
          path: |
            RPMS/**/*.rpm
            **/*.rpm
          if-no-files-found: error
          retention-days: 30

      # Authority: harbour-check.sh sees sources; only this sees the built
      # package (generated Requires/Provides, stripped symbols, real modes).
      # After upload: a rejected package is still worth installing, so this
      # must not block install. Known blockers waived (ci/harbour/waivers.conf,
      # why: docs/HARBOUR.md); anything else fails.
      - name: Validate the RPM against Harbour's rules
        run: |
          ./ci/apt-install.sh binutils rpm cpio file
          rpm=$(find . -name 'harbour-piirit-*.rpm' ! -name '*debug*' \
                       ! -name '*.src.rpm' | head -1)
          [ -n "$rpm" ] || { echo "::error::no RPM to validate"; exit 1; }
          echo "Validating $rpm"
          ./ci/harbour-validate-rpm.sh "$rpm"

  # Release gate: fresh clone of the same commit, rebuilt the way
  # docs/VERIFYING.md tells users (verify-release.sh), on another runner, with
  # Podman not Docker, another time zone and umask. Not byte-identical: no
  # release. Users' check is then one CI already passed.
  #
  # Beside `rpm`, not after: needs that package only to compare (`compare`).
  # Both cold, ~20-25 min each: release ~30 min, not ~50.
  reproduce:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != '' || inputs.rehearse
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Make room
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
                      "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"

      # Fresh clone, cold build: ~25 min. Cut off a stall (see rpm job).
      - name: Rebuild from a fresh clone
        timeout-minutes: 60
        env:
          PIIRIT_ENGINE: podman
          TZ: Pacific/Chatham
        run: |
          umask 0002
          mkdir -p reproduced
          PIIRIT_REPO="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
            ./scripts/verify-release.sh --no-download --ref "$GITHUB_SHA" \
              --save reproduced/reproduced.rpm

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reproduced
          path: reproduced/reproduced.rpm
          if-no-files-found: error
          retention-days: 30

  # Release package against the rebuild, verify-release.sh's own comparison:
  # byte for byte, else what differs inside. Own job: holds no write.
  compare:
    needs: [rpm, reproduce]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch both packages
        run: |
          gh run download "$GITHUB_RUN_ID" --dir rpms --pattern 'harbour-piirit-*'
          gh run download "$GITHUB_RUN_ID" --dir rpms --name reproduced

      - name: Compare
        env:
          PIIRIT_ENGINE: docker
        run: |
          rpm=$(find rpms -name 'harbour-piirit-*.rpm' ! -name '*debug*' \
                     ! -name '*.src.rpm' | head -1)
          [ -n "$rpm" ] || { echo "::error::no device RPM to check"; exit 1; }
          ./scripts/verify-release.sh --no-download --rpm "$rpm" --ref "$GITHUB_SHA" \
            --rebuilt rpms/reproduced.rpm

  # Release: package to GitHub release `v<version>`, CHANGELOG.md section as
  # notes. Own job so `contents: write` is held only here, never by the
  # --privileged SDK build.
  #
  # `v*` tag: `--verify-tag` refuses to invent one. Dispatch: release creates
  # the tag. Missing changelog section fails before publish
  # (scripts/release-notes.sh).
  release:
    needs: [rpm, compare]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE: ${{ inputs.release || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the package this run built
        run: gh run download "$GITHUB_RUN_ID" --dir rpms --pattern 'harbour-piirit-*'

      # Device package and checksum only; debug and source RPMs are for
      # developers.
      - name: Gather the assets
        run: |
          mkdir -p assets
          find rpms -name 'harbour-piirit-*.rpm' ! -name '*debug*' \
               ! -name '*.src.rpm' -exec cp {} assets/ \;
          [ -n "$(ls assets)" ] || { echo "::error::no device RPM to release"; exit 1; }
          (cd assets && sha256sum -- * > SHA256SUMS)
          cat assets/SHA256SUMS

      - name: Publish the release
        run: |
          if [ -n "$RELEASE" ]; then
            version=$RELEASE
            where="--target $GITHUB_SHA"
          else
            version=${GITHUB_REF_NAME#v}
            where="--verify-tag"
          fi
          ./scripts/release-notes.sh "$version" > notes.md
          # shellcheck disable=SC2086  # $where is one flag, or a flag and a SHA
          gh release create "v$version" $where \
            --title "Piirit $version" \
            --notes-file notes.md \
            assets/*
