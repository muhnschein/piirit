# Builds a device RPM inside the Sailfish SDK.
#
# Not part of `ci.yml`: it cross-compiles the whole workspace inside a
# multi-gigabyte SDK image, which is minutes of runner time nobody wants on
# every push. Run it from the Actions tab when a package is wanted, or on a
# tag.
#
# The SDK is what makes the result runnable on a phone: the app links
# against the target's Qt 5.6 and glibc, and a host-built binary has
# neither. See docs/BUILDING.md.
#
# aarch64 only, which is what this project targets (see the README): the
# SDK image below carries that architecture and no other, and nothing here
# has ever built a second one.
#
# Two things keep it short, each explained where it happens: the SDK image
# is one this repository derives and publishes rather than upstream's
# three-architecture one (`sdk-image.yml`), and `rust/target` and the
# crates are carried between runs.
name: rpm

on:
  workflow_dispatch:
    inputs:
      sfos_version:
        description: >
          Sailfish SDK version to build against. 5.2 is the Jolla Phone's
          baseline and the floor this project supports; Harbour also
          requires a binary to link __libc_start_main@GLIBC_2.34, which
          only a 5.x SDK's glibc provides. An older SDK builds a package
          that runs on older phones and that Harbour rejects.
        type: string
        default: "5.2.0.15"
      cargo_jobs:
        description: >
          How many cargo jobs inside scratchbox2. Four is the spec's
          default and what these builds run; drop to one if a build ever
          hangs there, which is what the setting is for. See
          docs/BUILDING.md.
        type: choice
        options: ["4", "2", "1"]
        default: "4"
  push:
    # `v*` for a release. `build-*` is a throwaway handle for running this
    # before it reaches the default branch, since workflow_dispatch only
    # becomes available once a workflow is on main.
    tags: ["v*", "build-*"]

permissions:
  contents: read
  # The derived SDK image lives in this repository's registry, and a run
  # that finds none there publishes the one it had to build.
  packages: write

jobs:
  rpm:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ARCH: aarch64
      SFOS: ${{ inputs.sfos_version || '5.2.0.15' }}
      CARGO_JOBS: ${{ inputs.cargo_jobs || '4' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Bundled beside the app; checksum-pinned by the script itself.
      - name: Fetch deltachat-rpc-server
        run: ./scripts/fetch-rpc-server.sh

      # Both inputs are free text from the dispatch form, and both are
      # spliced into a command below -- the version into an image tag, the
      # job count into the build's own shell.
      - name: Name the SDK image this build wants
        run: |
          [[ $SFOS =~ ^[0-9]+(\.[0-9]+){3}$ ]] || {
            echo "::error::sfos_version '$SFOS' is not a dotted version"; exit 1; }
          [[ $CARGO_JOBS =~ ^[1-9][0-9]?$ ]] || {
            echo "::error::cargo_jobs '$CARGO_JOBS' is not a small number"; exit 1; }
          owner=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          echo "SDK_IMAGE=ghcr.io/$owner/piirit-sdk:$SFOS-$ARCH" >> "$GITHUB_ENV"

      - name: Sign in to the registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # ci/build-sdk-image.sh says what this image is and why it is not
      # upstream's. Deriving one takes about as long as this whole workflow,
      # so it is done once and published; a run that finds none does it
      # rather than failing, and publishes it for the next.
      - name: Get the SDK image
        run: |
          if docker pull -q "$SDK_IMAGE"; then
            echo "using $SDK_IMAGE"
          else
            echo "::notice::no $SDK_IMAGE published yet; deriving one, which makes this run slower"
            # Room for the upstream image and the flattened one at once.
            # Defaulted rather than bare: `rm -rf ""` is an error, and it
            # would fail this step for the sake of a variable the runner
            # happens to set.
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
                        "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
            ./ci/build-sdk-image.sh "$SFOS" "$ARCH" "$SDK_IMAGE"
            docker push "$SDK_IMAGE" ||
              echo "::warning::could not publish $SDK_IMAGE; the next run will derive it again"
          fi
          id=$(docker image inspect --format '{{.Id}}' "$SDK_IMAGE")
          echo "SDK_IMAGE_ID=${id#sha256:}" >> "$GITHUB_ENV"

      # The image ships one target, named by the SDK's own convention.
      # Asked for rather than assumed, so an image whose naming differs
      # fails here with the list rather than deep inside rpmbuild.
      - name: Resolve the build target
        run: |
          targets=$(docker run --rm "$SDK_IMAGE" sb2-config -l 2>/dev/null || true)
          echo "available targets:"; echo "$targets"
          target=$(echo "$targets" | grep -- "-$ARCH\$" | tail -1)
          if [ -z "$target" ]; then
            echo "::error::no $ARCH target in $SDK_IMAGE; see the list above"
            exit 1
          fi
          echo "Building against $target"
          echo "TARGET=$target" >> "$GITHUB_ENV"

      # Every build used to produce harbour-piirit-0.1.0-1.aarch64.rpm,
      # because the spec pins both fields and mb2 runs with -X so nothing derives
      # them from git. Same name, same NEVRA, every time -- so `rpm -U`
      # and `pkcon install-local` saw a package that was already installed
      # and did nothing at all. A phone kept whatever build it had while
      # the file said it was new.
      #
      # The run number is monotonic, so each build is an upgrade of the
      # last. The spec keeps Release: 1 in the tree, which is what a tagged
      # release should be.
      #
      # Digits and periods only: Harbour rejects any other character in
      # Release, so the short SHA that used to be appended here would have
      # failed intake. It identifies the artifact below instead.
      - name: Stamp the build so each one is its own package
        run: |
          short=$(git rev-parse --short HEAD)
          release="1.${GITHUB_RUN_NUMBER}"
          sed -i "s/^Release:.*/Release:    ${release}/" rpm/harbour-piirit.spec
          grep '^Version:\|^Release:' rpm/harbour-piirit.spec
          echo "SHORT_SHA=$short" >> "$GITHUB_ENV"
          echo "RPM_RELEASE=$release" >> "$GITHUB_ENV"

      # What the build spends its time on, after the pull: compiling 56
      # crates, of which this project wrote four. The rest depend on the
      # lockfile and the toolchain in the image and on nothing else, so
      # they are worth carrying between runs -- with a cold cache the
      # compile is about four minutes, with a warm one about one.
      #
      # Keyed on the image as well as the lockfile: these are artifacts for
      # one target triple, built by the rust that image ships.
      - name: Restore the cross-compiled dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: rust/target
          key: rpm-target-${{ env.ARCH }}-${{ env.SDK_IMAGE_ID }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            rpm-target-${{ env.ARCH }}-${{ env.SDK_IMAGE_ID }}-
            rpm-target-${{ env.ARCH }}-

      # The crate sources themselves, which the build would otherwise
      # download from crates.io inside the container every time. Worth
      # little in seconds and a great deal in not depending on crates.io
      # being up while a release is being cut.
      - name: Restore the crates
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/piirit-cargo
          key: rpm-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: rpm-cargo-

      # Running as root is explicitly wrong -- sdk-manage refuses, saying
      # it cannot determine the Mer SDK user -- so the build stays as the
      # image's own mersdk, and everything it writes has to belong to it.
      - name: Hand the checkout to the SDK's build user
        run: |
          uid=$(docker run --rm "$SDK_IMAGE" id -u)
          gid=$(docker run --rm "$SDK_IMAGE" id -g)
          home=$(docker run --rm "$SDK_IMAGE" sh -c 'echo $HOME')
          echo "SDK builds as uid=$uid gid=$gid, HOME=$home"
          echo "BUILDDIR=$home/harbour-piirit" >> "$GITHUB_ENV"
          mkdir -p ~/.cache/piirit-cargo
          sudo chown -R "$uid:$gid" "$PWD" ~/.cache/piirit-cargo

      # Mounted inside the SDK user's home, and that placement is the
      # whole fix. rpm runs under scratchbox2, which redirects absolute
      # paths it does not recognise into the target rootfs -- so with the
      # tree at /build/harbour-piirit, mb2 wrote .mb2/spec (it is right
      # there afterwards, 10 KB of it) and rpm then looked for the same
      # path inside the target and found nothing:
      #
      #   error: Unable to open /build/harbour-piirit/.mb2/spec: No such file
      #
      # A file that exists and cannot be opened is two different roots.
      # docs/BUILDING.md bind-mounted under /home/mersdk for this
      # reason. The directory keeps the project's name either way: mb2
      # derives the package from it, so rpm/harbour-piirit.spec is found.
      #
      # `build-init` because mb2's help says a build directory is
      # initialised before it is built in, and `-X` (--no-fix-version)
      # because otherwise build-init asks `git describe` for a version,
      # finds no tags here, and stops before writing the spec at all.
      # `--no-check` matches that document too; the spec has no %check.
      #
      # `build-requires` has nothing to install against the derived image,
      # which already carries them -- it stays because a BuildRequires
      # added to the spec before the image is rebuilt would otherwise fail
      # much later and less clearly.
      #
      # `--privileged` is what the SDK image's own instructions run it
      # with; whether sb2 needs all of it has not been tried. The script is
      # single-quoted, so nothing the image printed above is spliced into
      # shell text; TARGET and CARGO_JOBS go in as environment variables.
      - name: Build the RPM
        run: |
          docker run --rm --privileged \
            -e TARGET -e CARGO_JOBS \
            -v "$PWD:$BUILDDIR" -w "$BUILDDIR" \
            -v "$HOME/.cache/piirit-cargo:/home/mersdk/.cargo" \
            "$SDK_IMAGE" \
            /bin/bash -c 'set -e
              since=$(date +%s)
              took() { echo "::notice::$1 took $(( $(date +%s) - since ))s"; since=$(date +%s); }

              mb2 -t "$TARGET" -X build-init
              took build-init
              mb2 -t "$TARGET" -X build-requires ||
                echo "::warning::mb2 build-requires failed; the SDK image may be behind the spec"
              took build-requires
              mb2 -t "$TARGET" -X build --no-check --define "jobs $CARGO_JOBS"
              took "the build at -j$CARGO_JOBS"'

      # `|| true` on both: the step runs under `bash -e`, and a missing
      # .mb2 would end it before the logs were shown.
      - name: Show mb2's state
        if: failure()
        run: ls -la .mb2 2>/dev/null || true; tail -60 .mb2/*.log 2>/dev/null || true

      # Back to the runner, or neither the upload nor the cache save can
      # read what was built. `mkdir` first because this runs even when the
      # step that creates that directory did not: `chown` on a path that is
      # not there fails, and failing here would bury the error that
      # actually stopped the build.
      - name: Take the tree back
        if: always()
        run: |
          mkdir -p ~/.cache/piirit-cargo
          sudo chown -R "$(id -u):$(id -g)" "$PWD" ~/.cache/piirit-cargo

      - name: Show what was built
        run: |
          find RPMS -name '*.rpm' -print -exec rpm -qip {} \; 2>/dev/null || \
            find . -name '*.rpm' -print

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harbour-piirit-${{ env.ARCH }}-sfos${{ env.SFOS }}-${{ env.SHORT_SHA }}
          path: |
            RPMS/**/*.rpm
            **/*.rpm
          if-no-files-found: error
          retention-days: 30

      # The authority. ci/harbour-check.sh answers the same questions from
      # the sources on every pull request, but only this sees the built
      # package -- the Requires and Provides rpm generated, the stripped
      # binary's symbols, the real file modes.
      #
      # After the upload, deliberately: a package that Harbour would reject
      # is still a package worth having on a phone, and this step failing
      # must not be what stops you installing it.
      #
      # Known blockers do not fail it; ci/harbour/waivers.conf says which,
      # and docs/HARBOUR.md says why. Anything else does.
      - name: Validate the RPM against Harbour's rules
        run: |
          ./ci/apt-install.sh binutils rpm cpio file
          rpm=$(find . -name 'harbour-piirit-*.rpm' ! -name '*debug*' \
                       ! -name '*.src.rpm' | head -1)
          [ -n "$rpm" ] || { echo "::error::no RPM to validate"; exit 1; }
          echo "Validating $rpm"
          ./ci/harbour-validate-rpm.sh "$rpm"
