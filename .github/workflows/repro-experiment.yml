# Throwaway experiment for issue #166: which files in the SDK image are
# owned by ids above the default 65536-wide rootless range? Not for merging.
name: repro-experiment

on:
  push:
    branches: [claude/repro-experiment]

permissions:
  contents: read

jobs:
  ids:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: List high-id files
        run: |
          sudo sed -i 's/^runner:.*/runner:165536:1000000/' /etc/subuid /etc/subgid
          podman system migrate
          img=ghcr.io/muhnschein/piirit-sdk:5.2.0.15-aarch64
          podman pull -q "$img"
          podman run --rm --user 0 "$img" sh -c '
            find / -xdev \( -uid +65535 -o -gid +65535 \) -printf "%u:%g %U:%G %p\n" 2>/dev/null > /tmp/hi
            echo "count: $(wc -l < /tmp/hi)"
            echo "== by owner"; cut -d" " -f1,2 /tmp/hi | sort | uniq -c
            echo "== by top directories"; cut -d" " -f3 /tmp/hi | cut -d/ -f1-5 | sort | uniq -c | sort -rn | head -30
            echo "== passwd entries above 65535"; awk -F: "\$3>65535||\$4>65535" /etc/passwd /etc/group'
