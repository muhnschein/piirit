# Bumps commit-pinned actions, keeping version comment in step. No cargo:
# Dependabot doesn't know 1.75 floor (rust/Cargo.toml). CI msrv judges.
# Prefixes: Conventional Commits titles (AGENTS.md "Git and PRs").
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
  # FFmpeg, x264 (third_party/, built in by piirit-video): fix-only branches
  # (release/7.1, stable), so bumps = security/bug fixes for the video reader.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(video)
