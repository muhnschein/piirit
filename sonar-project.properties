# SonarQube Cloud settings, read by scanner (.github/workflows/build.yml).
# Report, not gate: `make check` and ci.yml decide; nothing here flips a build.
# Coverage via `make sonar-reports`. Key = sonarcloud.io identity, fixed at import:
# renaming points scans at nothing.
sonar.projectKey=muhnschein_piirit
sonar.organization=muhnschein
sonar.projectName=Piirit

sonar.sourceEncoding=UTF-8

# Whole tree: secrets detector scans files no analyser claims (spec, desktop, shell).
sonar.sources=.

# Test code split: coverage and duplication measure app, not fixtures.
# ~28,000 test lines vs ~14,500 app (rule: tests exceed source).
# Rust unit tests live in `#[cfg(test)]` inside source files: can't move. Split catches
# integration tests and tests/silica-stubs doubles.
# Path in both sets: scanner errors "can't be indexed twice". So also in sonar.exclusions.
sonar.tests=rust/deltachat-jsonrpc/tests,rust/piirit-shim/tests,rust/piirit-video/tests,tests

sonar.exclusions=\
    vendor/**,\
    third_party/**,\
    **/target/**,\
    translations/**,\
    icons/**,\
    rust/deltachat-jsonrpc/tests/**,\
    rust/piirit-shim/tests/**,\
    rust/piirit-video/tests/**,\
    tests/**,\
    qml/js/EmojiData.js,\
    .github/codeql/rust-queries-tests/**,\
    **/*.png

# Not this project's to answer for:
# vendor/ (offline crates), third_party/ (patched qmetaobject): upstream defects.
# **/target/: cargo output. translations/: lupdate XML, read as TypeScript (39 files).
# icons/: PNG scans print UTF-8 warnings every run.
# qml/js/EmojiData.js: generated by scripts/fetch-emoji.py from emojibase.
# .github/codeql/rust-queries-tests/: bugs planted on purpose for CodeQL query test.

# --- C ---
#
# rust/piirit-video/csrc: C between FFmpeg, x264, Rust; C++ of H.264 plugin (tests'
# Gecko stand-in also C++: rust/piirit-video/tests/gmp_check.cpp). Scanner reads C/C++ only via compile
# database (needs include paths); crate's build.rs writes it, `make sonar-reports`
# copies it.
sonar.cfamily.compile-commands=rust/target/sonar/compile_commands.json

# --- Rust ---
#
# Sonar's Clippy off: would not run the gating clippy, or any: it invokes cargo at
# repo root, workspace is under rust/.
# No clippy report substituted: `make lint` (`-D warnings`) gates own warnings first.
# Other Sonar Rust rules unaffected.
sonar.rust.clippy.enabled=false

# Coverage from `cargo llvm-cov`, via `make sonar-reports`.
# Scanner never measures, only imports. Without this property + target: confident
# 0.0%, not "no data". Absent report file: scanner warning, not failure.
sonar.rust.lcov.reportPaths=rust/target/sonar/lcov.info

# Call page bridge: rust/piirit-shim/src/call_video.js, calls.js; map view: map_view.js. Tested in Node
# (tests/js/, call_bridge_js.rs); `make sonar-reports` writes it.
sonar.javascript.lcov.reportPaths=rust/target/sonar/js-lcov.info

# No coverage possible under qml/: scanner can't read .qml; .js runs in Qt engine or
# webxdc WebView, no coverage tool for either.
# Left in: one changed Format.js line was the only "new line to cover": 0.0%, gate red.
# scripts/*.py: scanner counts Python coverable, but fetch-emoji.py is a network
# maintainer tool; its output is checked byte-for-byte by ci/vendor-check.sh.
# ci/*.py: split-layers.py runs only inside sdk-image.yml; its output proven by
# build-sdk-image.sh's gate and scheduled.yml's repro (pinned vs upstream-derived).
# rust/piirit-video/csrc: Rust tests run it all, but cargo-llvm-cov sees only
# rustc-instrumented code; cc/gcc-built C has no counters, would read never run.
# Coverage exclusion only; issues still count.
sonar.coverage.exclusions=qml/**,scripts/*.py,ci/*.py,rust/piirit-video/csrc/**

# --- Findings decided against ---
#
# Here, not sonarcloud.io: "won't fix" is per issue, invisible from tree.
# One rule per path; `*` in segment, `**` across. Only issues hidden: files still
# seen by secrets detector and other rules.
# App cognitive complexity not waived: open until file touched.
sonar.issue.ignore.multicriteria=qtglob,testcc,fakecc,charclass,es5,calllog,x264log,x264fmt,gmpown,aptlists,splitslip,splitargv

# `use qmetaobject::*;` in the two crates built on it: prelude, glob re-exports, derive
# and qt_method! need it. Clippy wildcard_imports allowed, as shim and app. JSON-RPC
# crate has no glob import.
sonar.issue.ignore.multicriteria.qtglob.ruleKey=rust:S2208
sonar.issue.ignore.multicriteria.qtglob.resourceKey=rust/piirit-*/src/**/*.rs

# Test cognitive complexity: linear scenario; helpers would hide it. Clippy
# too_many_lines allowed per test.
sonar.issue.ignore.multicriteria.testcc.ruleKey=rust:S3776
sonar.issue.ignore.multicriteria.testcc.resourceKey=rust/**/tests/**/*.rs

# Fake servers tests spawn (`test = false`). One match arm per RPC method, so count
# tracks protocol (serve(): 206 vs 15).
sonar.issue.ignore.multicriteria.fakecc.ruleKey=rust:S3776
sonar.issue.ignore.multicriteria.fakecc.resourceKey=rust/**/src/bin/fake_*.rs

# '[:space:]' in ci/harbour-check.sh: POSIX class name, not a string script owns.
sonar.issue.ignore.multicriteria.charclass.ruleKey=shelldre:S1192
sonar.issue.ignore.multicriteria.charclass.resourceKey=ci/harbour-check.sh

# `indexOf(x) !== -1`, not `includes(x)`: qml/ JS runs on Qt 5.6 ES5 engine. Host Qt
# tests wouldn't notice. Tree uses `indexOf(x) === 0` for prefix.
sonar.issue.ignore.multicriteria.es5.ruleKey=javascript:S7765
sonar.issue.ignore.multicriteria.es5.resourceKey=qml/**/*.js

# Path injection: plugin appends to PIIRIT_CALL_LOG, set only by app for the plugin
# process Gecko starts (piirit-shim prepare_media_plugins). Never creates the file, only
# appends. Env setter can already run code (LD_PRELOAD): no new reach. Tests need per-test
# log. Waiver: this rule, this file; a second opened path would be news.
sonar.issue.ignore.multicriteria.calllog.ruleKey=cppsecurity:S2083
sonar.issue.ignore.multicriteria.calllog.resourceKey=rust/piirit-video/csrc/gmp_h264.cpp

# x264 callback type and format string fixed by x264 (cpp:S5008, cpp:S5281). Gecko holds
# encoder by raw pointer; EncodingComplete() makes it `delete this`, so `new` and
# `delete this` stay (cpp:S5025). Every other rule stays on for the file.
sonar.issue.ignore.multicriteria.x264log.ruleKey=cpp:S5008
sonar.issue.ignore.multicriteria.x264log.resourceKey=rust/piirit-video/csrc/gmp_h264.cpp
sonar.issue.ignore.multicriteria.x264fmt.ruleKey=cpp:S5281
sonar.issue.ignore.multicriteria.x264fmt.resourceKey=rust/piirit-video/csrc/gmp_h264.cpp
sonar.issue.ignore.multicriteria.gmpown.ruleKey=cpp:S5025
sonar.issue.ignore.multicriteria.gmpown.resourceKey=rust/piirit-video/csrc/gmp_h264.cpp

# Clear-text URLs in ci/apt-install-selftest.sh: stand-in apt lists, never fetched.
# Shaped like runner's real ones: Ubuntu archive is http, apt checks signed Release.
sonar.issue.ignore.multicriteria.aptlists.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.aptlists.resourceKey=ci/apt-install-selftest.sh

# ci/split-layers.py: copies tar members into new tars, never extracts; paths are
# build-sdk-image.sh's own temp dir. Zip Slip and argv path traversal don't apply.
sonar.issue.ignore.multicriteria.splitslip.ruleKey=pythonsecurity:S6096
sonar.issue.ignore.multicriteria.splitslip.resourceKey=ci/split-layers.py
sonar.issue.ignore.multicriteria.splitargv.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.splitargv.resourceKey=ci/split-layers.py
