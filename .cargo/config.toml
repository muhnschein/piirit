# Deps resolved to rust/Cargo.toml floor (`rust-version = "1.75"`), not host
# cargo. Resolver "2" ignores rust-version: newest deps break msrv job on
# Sailfish. This prefers newest release building on 1.75 (resolver "3" default);
# resolver "3" unusable: SDK cargo 1.75 can't read it. Cargo <1.84 ignores key.
[resolver]
incompatible-rust-versions = "fallback"
#
# Top of tree, not rust/.cargo/ (vendored build): spec writes there, cargo reads
# both.
