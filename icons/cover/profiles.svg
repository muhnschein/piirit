    </clipPath>
    <clipPath id="back">
      <circle cx="11.5" cy="11.5" r="7.5"/>
    </clipPath>
  </defs>
  <g clip-path="url(#behind)">
    <circle cx="11.5" cy="11.5" r="8.25"/>
    <g clip-path="url(#back)" fill="#ffffff" stroke="none">
      <circle cx="11.5" cy="9.6" r="2.7"/>
      <path d="M4.5 19.5C5.3 15.9 8 14 11.5 14C15 14 17.7 15.9 18.5 19.5Z"/>
    </g>
  </g>
  <circle cx="20.5" cy="20.5" r="8.25"/>
  <g clip-path="url(#front)" fill="#ffffff" stroke="none">
